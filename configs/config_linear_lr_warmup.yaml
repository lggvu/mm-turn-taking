# Default configuration for MM-VAP Lightning

# Disable Hydra's own outputs/<date>/<time> run directory, .hydra/ config
# dump, and job log file -- this repo already organizes runs under
# paths.save_dir (see below).
hydra:
  run:
    dir: .
  output_subdir: null

defaults:
  - hydra/job_logging: stdout
  - model: early_va_fusion
  - data: avcocktail
  - encoder: cpc
  - _self_

# Trainer configuration
trainer:
  max_epochs: 10
  accelerator: gpu
  devices: 1
  precision: 32
  gradient_clip_val: 5.0
  log_every_n_steps: 10
  check_val_every_n_epoch: 1

# Optimizer configuration
optimizer:
  name: AdamW
  lr: 3e-5
  betas: [0.9, 0.999]
  weight_decay: 0.001

# Scheduler configuration (optional)
scheduler:
  enabled: true
  name: LinearLR
  start_factor: 0.33
  end_factor: 1.0
  total_iters: 2000

# Training configuration
training:
  batch_size: 8
  num_workers: 8
  prefetch_factor: 4
  pin_memory: false
  seed: 0
  mode: ${model.base.mode}

# Validation configuration
validation:
  batch_size: 4
  num_workers: 1
  prefetch_factor: 1

# Data augmentation
augmentation:
  flip_channel_prob: 0.0
  mask_vad_prob: 0.0
  mask_vad_scale: 0.1

# Paths
paths:
  save_dir: ${hydra:runtime.cwd}/save
  log_dir: logs
  checkpoint_dir: checkpoints
  pretrained_checkpoint: null  # Path to pre-trained PyTorch or Lightning checkpoint
  prefix_save: ${model.model_name}-${data.name}-${training.mode}
  prefix_suffix: ""  # Optional suffix to append to prefix_save (use from command line)

# Misc
debug: false
