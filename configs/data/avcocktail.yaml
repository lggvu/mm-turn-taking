# @package _group_
# AVCocktail dataset configuration
#
# Every path below is a placeholder -- set it to where you unpacked the
# AVCocktail (MCoRec) dataset, either by editing this file or overriding on
# the command line, e.g.:
#   python scripts/train.py data.train.wavdir=/data/avcocktail/train ...

# Dataset name (used for organizing outputs)
name: avcocktail
datamodule_class: AVCocktailDataModule  # Lightning DataModule class to use

# Dataset paths
train:
  video_directory: /path/to/avcocktail/train
  channelmaps: /path/to/avcocktail/assets/central-train_channelmaps.pkl
  wavdir: /path/to/avcocktail/train
  pickle_base: /path/to/avcocktail/assets
  train_list:

val:
  video_directory: /path/to/avcocktail/dev
  channelmaps: /path/to/avcocktail/assets/central-dev_channelmaps_filtered.pkl
  wavdir: /path/to/avcocktail/dev
  pickle_base: /path/to/avcocktail/assets
  val_list:

# Data configuration
# sample_rate: 16000
feature_hz: 50
# video_fps: 30
window_length: 20  # seconds
future_context: 2  # seconds
fps: 30 # same as video_fps, duplicated.

# K-fold configuration
n_folds: 1
current_fold: 0

sampling_rate: 16000
